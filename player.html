<!DOCTYPE html>
<html lang="en" class="player-page">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>NES Player</title>
  <link rel="icon" type="image/svg+xml" href="https://lsong.org/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="player-page">
  <div class="page">
    <!-- Left: game info -->
    <aside class="info-panel">
      <img class="game-cover" id="game-cover" alt="cover">
      <div class="game-meta-info">
        <span class="game-meta-title" id="game-title"></span>
        <span class="game-meta-cn" id="game-title-cn"></span>
        <div class="game-desc" id="game-desc"></div>
        <div class="game-badges" id="game-badges"></div>
      </div>
    </aside>

    <!-- Center: screen -->
    <div class="screen-area">
      <div class="screen-wrapper">
        <canvas id="screen" width="768" height="720"></canvas>
        <div class="overlay" id="loading">
          <div class="spinner"></div>
          <p class="overlay-text">Loading…</p>
        </div>
        <div class="overlay hidden" id="error">
          <p class="error-msg" id="error-msg"></p>
        </div>
      </div>
    </div>

    <!-- Right: controller -->
    <div class="controller-panel">
      <div class="controller">
        <div class="dpad" role="group" aria-label="Directional joystick: drag to move, WASD or arrow keys">
          <span class="dpad-btn up" data-btn="up" aria-hidden="true">▲</span>
          <span class="dpad-btn down" data-btn="down" aria-hidden="true">▼</span>
          <span class="dpad-btn left" data-btn="left" aria-hidden="true">◀</span>
          <span class="dpad-btn right" data-btn="right" aria-hidden="true">▶</span>
          <span class="stick-thumb" aria-hidden="true"></span>
        </div>

        <div class="center-buttons">
          <div>
            <button type="button" class="center-btn" data-btn="select" aria-pressed="false">Select</button>
            <div class="btn-label"><kbd>shift</kbd></div>
          </div>
          <div>
            <button type="button" class="center-btn" data-btn="start" aria-pressed="false">Start</button>
            <div class="btn-label"><kbd>enter</kbd></div>
          </div>
        </div>

        <div class="action-buttons">
          <button type="button" class="action-btn" data-btn="b" aria-label="B" aria-pressed="false">
            <span class="btn-circle">B</span>
            <span class="btn-label"><kbd>K</kbd></span>
          </button>
          <button type="button" class="action-btn" data-btn="a" aria-label="A" aria-pressed="false">
            <span class="btn-circle">A</span>
            <span class="btn-label"><kbd>L</kbd></span>
          </button>
        </div>
      </div>
      <!-- <div class="kbd-hint"><kbd>WASD</kbd> move · <kbd>L</kbd> A · <kbd>K</kbd> B<br><kbd>↵</kbd> start · <kbd>⇧</kbd> select</div> -->
    </div>
  </div>

  <script type="module" src="js/player.js"></script>
</body>

</html>
